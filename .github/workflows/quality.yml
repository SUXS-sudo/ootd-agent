name: Quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql+pymysql://ootd:ootd@127.0.0.1:3306/ootd_test?charset=utf8mb4
      LANGGRAPH_CHECKPOINT_URL: mysql://ootd:ootd@127.0.0.1:3306/ootd_test?charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379/0
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ootd_test
          MYSQL_USER: ootd
          MYSQL_PASSWORD: ootd
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uootd -pootd"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install -r backend/requirements.txt pytest-github-actions-annotate-failures
      - run: npm run lint
      - run: npm run test:web
      - run: npm run test:api
